# @gloss configures gmi:GlossCli scope=file
name: GlossMark
description: Lint @gloss markers, report ontology drift, and post the per-view impact of a pull request as a comment.
branding: { icon: book-open, color: purple }
inputs:
  root:
    description: Directory holding glossmark.yaml
    default: "."
  base:
    description: Git ref to diff against (default the PR base)
    default: ""
  fail-on:
    description: Gate class that fails the job (HARD | SOFT | none)
    default: HARD
  coverage-fail-under:
    description: Minimum coverage percentage (0 disables)
    default: "0"
  comment:
    description: Post the impact as a PR comment (needs pull-requests write permission)
    default: "true"
  version:
    description: gloss version to install (go install ...@<version>)
    default: latest
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with: { go-version: "1.24" }
    - name: Install gloss
      shell: bash
      run: go install github.com/mckalvan/glossmark/cmd/gloss@${{ inputs.version }}
    - name: Fetch base
      if: github.event_name == 'pull_request'
      shell: bash
      run: git fetch --no-tags --depth=200 origin ${{ github.base_ref }}
    - name: gloss check
      shell: bash
      working-directory: ${{ inputs.root }}
      run: gloss check
    - name: gloss drift
      shell: bash
      working-directory: ${{ inputs.root }}
      run: gloss drift --fail-on violation,dangling | tee "$RUNNER_TEMP/drift.txt"
    - name: gloss coverage
      shell: bash
      working-directory: ${{ inputs.root }}
      run: gloss coverage --fail-under ${{ inputs.coverage-fail-under }}
    - name: gloss diff
      id: diff
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        BASE="${{ inputs.base }}"; [ -z "$BASE" ] && BASE="origin/${{ github.base_ref }}"
        set +e
        gloss diff --base "$BASE" --format markdown --fail-on ${{ inputs.fail-on }} -o "$RUNNER_TEMP/impact.md"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: actions/github-script@v7
      env: { IMPACT: "${{ runner.temp }}/impact.md" }
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.IMPACT, 'utf8');
          const marker = '<!-- glossmark-impact -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find(c => c.body && c.body.includes(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Gate
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        if [ "${{ steps.diff.outputs.exit }}" != "0" ]; then echo "::error::gloss diff: ${{ inputs.fail-on }} changes need a human decision"; exit 1; fi

# @gloss configures gmi:GlossCli scope=file
name: GlossMark
description: Lint @gloss markers, report ontology drift, and post the per-view impact of a pull request as a comment.
branding: { icon: book-open, color: purple }
inputs:
  root:
    description: Directory holding glossmark.yaml
    default: "."
  base:
    description: Git ref to diff against (default the PR base)
    default: ""
  fail-on:
    description: Gate class that fails the job (HARD | SOFT | none)
    default: HARD
  drift-fail-on:
    description: Comma-separated gloss drift finding kinds that fail the job (gloss drift --fail-on; e.g. add stale to require every changed link to be re-confirmed)
    default: violation,value-drift,dangling,overdue,planned-closed,plan-overdue
  check-graph:
    description: Fail when the committed .glossmark/graph.jsonl is not what gloss build makes from the tree (gloss build --check)
    default: "false"
  coverage-fail-under:
    description: Minimum concept coverage percentage, implementation concepts with an artifact and a verifier (0 disables; "current" fails only when the PR lowers the base's coverage)
    default: "0"
  actor:
    description: Who made the change, for the agent-remit gate (agent:<name> or human:<name>). Default is the PR author, agent:<name> for a bot account. New links are gated as this actor as well as the one the committed ledger claims, so editing the ledger cannot lower the gate.
    default: ""
  comment:
    description: Post the impact as a PR comment (needs pull-requests write permission)
    default: "true"
  version:
    description: gloss release to install. A tag (vX.Y.Z) downloads the release binary; source builds the Action's own checkout (uses ./ in the GlossMark repository); anything else (latest, a commit) is built with go install.
    default: v0.2.0
runs:
  using: composite
  steps:
    - name: Install gloss (release binary)
      id: binary
      if: startsWith(inputs.version, 'v')
      shell: bash
      env: { GLOSS_INSTALL_DIR: "${{ runner.temp }}/gloss-bin" }
      run: |
        if sh "${{ github.action_path }}/install.sh" "${{ inputs.version }}"; then
          echo "$GLOSS_INSTALL_DIR" >> "$GITHUB_PATH"
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::no release binary for ${{ inputs.version }}; building from source with go install instead"
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/setup-go@v5
      if: steps.binary.outputs.ok != 'true'
      with: { go-version: "1.24" }
    - name: Install gloss (source)
      if: inputs.version == 'source'
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        go build -trimpath -o "$RUNNER_TEMP/gloss-src/gloss" ./cmd/gloss
        echo "$RUNNER_TEMP/gloss-src" >> "$GITHUB_PATH"
    - name: Install gloss (go install)
      if: steps.binary.outputs.ok != 'true' && inputs.version != 'source'
      shell: bash
      run: |
        V="${{ inputs.version }}"
        case "$V" in v*) V=latest ;; esac
        go install "github.com/mckalvan/glossmark/cmd/gloss@$V"
    - name: Fetch base
      if: github.event_name == 'pull_request'
      shell: bash
      env: { BASE_REF: "${{ github.base_ref }}" }
      # Depth only for a shallow checkout: --depth on a full clone would make it
      # shallow and cut the comment's recent history short.
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --depth=200 origin "$BASE_REF"
        else
          git fetch --no-tags origin "$BASE_REF"
        fi
    - name: gloss build --check
      if: inputs.check-graph == 'true'
      shell: bash
      working-directory: ${{ inputs.root }}
      run: gloss build --check -q
    - name: gloss check
      shell: bash
      working-directory: ${{ inputs.root }}
      run: gloss check
    - name: gloss drift
      shell: bash
      working-directory: ${{ inputs.root }}
      env: { DRIFT_FAIL_ON: "${{ inputs.drift-fail-on }}" }
      run: gloss drift --fail-on "$DRIFT_FAIL_ON" | tee "$RUNNER_TEMP/drift.txt"
    - name: gloss coverage
      shell: bash
      working-directory: ${{ inputs.root }}
      env: { FAIL_UNDER: "${{ inputs.coverage-fail-under }}" }
      run: gloss coverage --fail-under "$FAIL_UNDER"
    - name: gloss diff
      id: diff
      if: github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ inputs.root }}
      # Inputs and the base branch name reach the shell as variables, never as
      # script text: a branch named $(...) would otherwise run.
      env:
        BASE: "${{ inputs.base }}"
        BASE_REF: "${{ github.base_ref }}"
        FAIL_ON: "${{ inputs.fail-on }}"
        ACTOR: "${{ inputs.actor }}"
        AUTHOR: "${{ github.event.pull_request.user.login }}"
        AUTHOR_TYPE: "${{ github.event.pull_request.user.type }}"
      run: |
        [ -z "$BASE" ] && BASE="origin/$BASE_REF"
        # The actor comes from GitHub, not from the ledger the PR commits (#186).
        if [ -z "$ACTOR" ] && [ -n "$AUTHOR" ]; then
          if [ "$AUTHOR_TYPE" = "Bot" ]; then ACTOR="agent:${AUTHOR%\[bot\]}"; else ACTOR="human:$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"; fi
        fi
        set +e
        gloss diff --base "$BASE" --actor "$ACTOR" --format markdown --fail-on "$FAIL_ON" -o "$RUNNER_TEMP/impact.md"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
    - name: Comment on PR
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      uses: actions/github-script@v7
      env: { IMPACT: "${{ runner.temp }}/impact.md", ROOT: "${{ inputs.root }}" }
      with:
        script: |
          const fs = require('fs');
          // One comment per workspace: a matrix over several roots keeps one
          // comment each, and a re-run updates its own in place.
          const root = process.env.ROOT.replace(/^(\.\/)+/, '').replace(/\/+$/, '') || '.';
          const marker = `<!-- glossmark-impact:${root} -->`;
          let body = marker + '\n' + fs.readFileSync(process.env.IMPACT, 'utf8');
          if (root !== '.') body = body.replace(/^(#+ .*)$/m, `$1 · \`${root}\``);
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          // A comment from before the key existed belongs to the root workspace.
          const legacy = c => root === '.' && c.body.includes('<!-- glossmark-impact -->') && !c.body.includes('<!-- glossmark-impact:');
          const mine = comments.find(c => c.body && (c.body.includes(marker) || legacy(c)));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });
    - name: Gate
      if: github.event_name == 'pull_request'
      shell: bash
      env: { DIFF_EXIT: "${{ steps.diff.outputs.exit }}", FAIL_ON: "${{ inputs.fail-on }}" }
      run: |
        if [ "$DIFF_EXIT" != "0" ]; then echo "::error::gloss diff: $FAIL_ON changes need a human decision"; exit 1; fi

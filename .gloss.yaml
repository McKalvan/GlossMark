# .gloss.yaml (repo root): the GlossMark toolchain as one system. What it declares
# here is compared by `gloss drift` with what the markers in the code derive.
boundary: arch:glossmark
level: system
label: GlossMark
# inherit compares the root with the union of what cmd/ and internal/ declare;
# gm:Onboarding is added here for the skill shipped in skills/. The flows
# inherit too (ADR 0026): the root produces and publishes what its two
# containers do, and their code markers say so.
realizes: [inherit, gm:Onboarding, gmi:IncrementCurator]
produces: [inherit]
publishes: [inherit]
owner: glossmark

# .gloss.yaml (repo root): the GlossMark toolchain as one system. What it declares
# here is compared by `gloss drift` with what the markers in the code derive.
boundary: arch:glossmark
level: system
label: GlossMark
# realizes: inherit compares the root with the union of what cmd/ and internal/
# declare; gm:Onboarding is added here for the skill shipped in skills/.
realizes: [inherit, gm:Onboarding]
produces: [gm:Graph, gm:View, gm:Drift, gm:Impact, gm:Landscape, gm:Coverage, gm:DecisionRequest, gm:ProposedLink]
publishes: [gm:LinkProposed, gm:LinkAccepted, gm:LinkRejected, gm:LinkStale, gm:DecisionRequested, gm:DriftDetected]
owner: glossmark

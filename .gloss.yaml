# .gloss.yaml (repo root): the GlossMark toolchain as one system. What it declares
# here is compared by `gloss drift` with what the markers in the code derive.
boundary: arch:glossmark
level: system
label: GlossMark
realizes: [gm:Toolchain, gm:Extraction, gm:Checking, gm:Rollup, gm:DriftDetection, gm:Gating, gm:Review, gm:Projection, gm:Publication, gm:Federation, gm:Guidance, gm:TierSeparation, gm:PublishedSeam, gm:OwnSubjectRule, gm:DeclaredCapability]
produces: [gm:Graph, gm:View, gm:Drift, gm:Impact, gm:Landscape, gm:Coverage, gm:DecisionRequest]
publishes: [gm:LinkProposed, gm:LinkAccepted, gm:LinkRejected, gm:DecisionRequested, gm:DriftDetected]
owner: glossmark

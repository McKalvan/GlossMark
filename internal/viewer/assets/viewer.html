<!doctype html>
<!-- @gloss implements gmi:HtmlViewer scope=file -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlossMark viewer</title>
<style>
/* ---- theme tokens ---- */
:root{
  --bg:#f6f7f9;--panel:#ffffff;--fg:#1c2128;--muted:#5d6670;--line:#d9dee5;--accent:#2b6cb0;
  --canvas:#fbfcfd;--grid:#e9edf2;--boundary-fill:#e3e7ec;--boundary-stroke:#6b7682;--boundary-open:rgba(107,118,130,.07);--artifact-fill:#cfd6de;
  --edge:#7b8794;--edge-contain:#aeb7c2;--label:#1c2128;--label-halo:rgba(251,252,253,.85);--tip-bg:#1c2128;--tip-fg:#f6f7f9;
  --gold:#d4a017;--added:#1f8a4c;--removed:#c62828;--changed:#e08a00;--select:#2b6cb0;--hard:#c62828;--soft:#e08a00;--auto:#1f8a4c;
  --crit-low:#5f8f6a;--crit-medium:#c9a227;--crit-high:#e07b00;--crit-critical:#c62828;
  --node-sat:62%;--node-light:80%;--stroke-sat:55%;--stroke-light:40%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c;--panel:#1a2029;--fg:#e4e8ee;--muted:#98a2ae;--line:#2c3542;--accent:#6aa5e8;
  --canvas:#0f1318;--grid:#1a2029;--boundary-fill:#2a323d;--boundary-stroke:#9aa5b2;--boundary-open:rgba(154,165,178,.08);--artifact-fill:#3a4452;
  --edge:#8a96a3;--edge-contain:#4a5563;--label:#e4e8ee;--label-halo:rgba(15,19,24,.85);--tip-bg:#e4e8ee;--tip-fg:#12161c;
  --gold:#f0c040;--added:#4cc07a;--removed:#ff6b6b;--changed:#ffb04a;--select:#6aa5e8;--hard:#ff6b6b;--soft:#ffb04a;--auto:#4cc07a;
  --crit-low:#7fb58b;--crit-medium:#e0bd4a;--crit-high:#ff9a3c;--crit-critical:#ff6b6b;
  --node-sat:40%;--node-light:34%;--stroke-sat:60%;--stroke-light:68%;
}}
:root[data-theme="dark"]{
  --bg:#12161c;--panel:#1a2029;--fg:#e4e8ee;--muted:#98a2ae;--line:#2c3542;--accent:#6aa5e8;
  --canvas:#0f1318;--grid:#1a2029;--boundary-fill:#2a323d;--boundary-stroke:#9aa5b2;--boundary-open:rgba(154,165,178,.08);--artifact-fill:#3a4452;
  --edge:#8a96a3;--edge-contain:#4a5563;--label:#e4e8ee;--label-halo:rgba(15,19,24,.85);--tip-bg:#e4e8ee;--tip-fg:#12161c;
  --gold:#f0c040;--added:#4cc07a;--removed:#ff6b6b;--changed:#ffb04a;--select:#6aa5e8;--hard:#ff6b6b;--soft:#ffb04a;--auto:#4cc07a;
  --crit-low:#7fb58b;--crit-medium:#e0bd4a;--crit-high:#ff9a3c;--crit-critical:#ff6b6b;
  --node-sat:40%;--node-light:34%;--stroke-sat:60%;--stroke-light:68%;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
header .meta{color:var(--muted);font-size:12px}
header .spacer{flex:1}
.bar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap;font-size:12px}
.bar .sep{width:1px;height:18px;background:var(--line)}
select,input[type=text],button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.on{border-color:var(--accent);color:var(--accent)}
input[type=text]{min-width:160px}
#crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#crumbs a{color:var(--accent);cursor:pointer;text-decoration:none;padding:2px 4px;border-radius:4px}
#crumbs a:hover{background:var(--bg)}
#crumbs .cur{font-weight:650}
#crumbs .arr{color:var(--muted)}
#crumbs .slicechip{display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:1px 4px 1px 8px;border-radius:12px;border:1px solid var(--accent);color:var(--accent);font-size:11.5px}
#crumbs .slicechip a{padding:0 5px;border-radius:10px}
#filters{display:none;flex-direction:column;gap:4px;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12px}
#filters.on{display:flex}
.fgroup{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fgroup .gl{color:var(--muted);min-width:80px;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;user-select:none;font-size:11.5px;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip.off{opacity:.45;text-decoration:line-through}
.chip .n{color:var(--muted);font-size:10.5px}
.chip .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip .dot.low{background:var(--crit-low)}.chip .dot.medium{background:var(--crit-medium)}.chip .dot.high{background:var(--crit-high)}.chip .dot.critical{background:var(--crit-critical)}
.chip .dot.none{border:1px dashed var(--muted)}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0;background:var(--canvas)}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}canvas.hit{cursor:pointer}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted);font-size:15px;white-space:pre-wrap}
#msg.on{display:flex}
#tip{position:absolute;pointer-events:none;display:none;max-width:340px;background:var(--tip-bg);color:var(--tip-fg);padding:7px 9px;border-radius:6px;font-size:12px;line-height:1.35;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#tip b{font-weight:650}#tip .k{opacity:.7}#tip .def{margin:3px 0}#tip ul{margin:3px 0 0;padding-left:16px}
#status{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
#hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none;text-align:right}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px 14px;font-size:12px}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 6px}
aside h2:first-child{margin-top:0}
aside .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
aside dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0}
aside dt{color:var(--muted)}aside dd{margin:0;word-break:break-word}
aside ul{margin:4px 0;padding-left:16px}aside li{margin:2px 0}
aside .via{color:var(--muted);font-size:11px;word-break:break-all}
aside .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
aside a.n{color:var(--accent);cursor:pointer;text-decoration:none}aside a.n:hover{text-decoration:underline}
aside .acts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.legend>span{display:inline-flex;align-items:center;gap:6px;margin:2px 12px 2px 0}
.legend .defs{margin-top:6px}.legend .defs summary{cursor:pointer;color:var(--accent)}
.legend .defs h3{font-size:11px;font-weight:650;color:var(--muted);margin:8px 0 2px}
.legend .defs dl{grid-template-columns:1fr;gap:0}.legend .defs dt{color:var(--fg);display:flex;align-items:center;gap:6px;margin-top:4px}
.legend .defs dd{color:var(--muted)}.legend .defs p{color:var(--muted);margin:2px 0}
.sw{display:inline-block;width:14px;height:14px;border:2px solid var(--boundary-stroke);background:var(--boundary-fill)}
.sw.c{border-radius:50%}.sw.r{border-radius:4px}.sw.a{width:10px;height:10px;background:var(--artifact-fill)}
.sw.o{background:var(--boundary-open);width:22px;height:16px;border-radius:4px}
.sw.u{background:transparent;border:1.5px dashed var(--muted);width:22px;height:16px;border-radius:4px}
.sw.i{border-style:dashed}.sw.p{box-shadow:0 0 0 2px var(--gold)}
.sw.k{background:transparent;border-width:2.5px}
.sw.k.low{border-color:var(--crit-low)}.sw.k.medium{border-color:var(--crit-medium)}.sw.k.high{border-color:var(--crit-high)}.sw.k.critical{border-color:var(--crit-critical)}
.ln{display:inline-block;width:28px;border-top:2px solid var(--edge)}.ln.d{border-top-style:dashed}.ln.dot{border-top-style:dotted}.ln.thin{border-top-width:1px}.ln.thick{border-top-width:3.5px}
.ln.add{border-color:var(--added)}.ln.rem{border-color:var(--removed)}
.gate{font-weight:650;padding:1px 6px;border-radius:4px;color:#fff;font-size:11px}
.gate.HARD{background:var(--hard)}.gate.SOFT{background:var(--soft)}.gate.AUTO{background:var(--auto)}
.crit{font-weight:650;padding:0 6px;border-radius:4px;color:#fff;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.crit.low{background:var(--crit-low)}.crit.medium{background:var(--crit-medium)}.crit.high{background:var(--crit-high)}.crit.critical{background:var(--crit-critical)}
.chg{border-left:3px solid var(--line);padding:3px 8px;margin:4px 0}
.chg.HARD{border-color:var(--hard)}.chg.SOFT{border-color:var(--soft)}.chg.AUTO{border-color:var(--auto)}
.chg .path{color:var(--muted);font-size:11px;word-break:break-all}
.badge{display:inline-block;padding:0 5px;border-radius:8px;background:var(--line);font-size:11px;margin-left:4px}
#sheetBtn{display:none}
/* Phones: one-line header and toolbar (the toolbar scrolls sideways), and the
   panel as a bottom sheet over the canvas, collapsed to its handle until tapped,
   so opening it does not resize the map. */
@supports (height:100dvh){body{height:100dvh}}
@media (max-width:760px){
  #hint{display:none}
  main{position:relative}
  header{gap:8px;padding:6px 12px;flex-wrap:nowrap}
  header h1{font-size:14px}
  #generated{display:none}
  #repo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .spacer{flex:1 1 0;min-width:0}
  header label.meta{flex:none}
  #themeBtn{flex:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar>*{flex:none}
  #crumbs{flex-wrap:nowrap;white-space:nowrap}
  /* 16px keeps iOS from zooming the page when a field gets focus. */
  select,input[type=text]{font-size:16px;padding:3px 6px}
  input[type=text]{min-width:0;width:140px}
  #filters{padding-left:12px;padding-right:12px;max-height:40vh;overflow-y:auto}
  .chip{padding:3px 10px}
  #status{bottom:50px}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:48%;border-left:0;border-top:1px solid var(--line);padding:0 14px 12px;z-index:4;box-shadow:0 -6px 18px rgba(0,0,0,.12)}
  aside.min{height:auto;overflow:hidden;padding-bottom:0}
  aside.min #panelBody{display:none}
  #sheetBtn{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:1;width:calc(100% + 28px);margin:0 -14px 8px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--panel);text-align:left}
  aside.min #sheetBtn{margin-bottom:0;border-bottom:0}
  #sheetBtn .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  #sheetBtn .c{color:var(--muted)}
}
</style>
</head>
<body>
<header>
  <h1>GlossMark</h1>
  <span class="meta" id="repo"></span>
  <span class="meta" id="generated"></span>
  <span class="spacer"></span>
  <label class="meta">View <select id="viewSel"></select></label>
  <button id="themeBtn" title="Cycle theme: auto / light / dark">Theme: auto</button>
</header>
<div class="bar">
  <span id="crumbs"></span>
  <span class="sep"></span>
  <input type="text" id="search" placeholder="Search id / label…" autocomplete="off">
  <button id="filtersBtn" title="Filter by type, tier, namespace, kind, level, criticality and relation">Filters</button>
  <span class="sep"></span>
  <button id="expandAll" title="Open every boundary and part-of tree">Expand all</button>
  <button id="collapseAll" title="Back to the top: every boundary closed">Collapse all</button>
  <button id="fit" title="Fit to window (f)">Fit</button>
  <button id="relayout">Re-layout</button>
</div>
<div id="filters"></div>
<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="msg"></div>
    <div id="status"></div>
    <div id="hint"></div>
  </div>
  <aside id="panel" class="min"><button id="sheetBtn" type="button" aria-expanded="false"><span class="t"></span><span class="c"></span></button><div id="panelBody"></div></aside>
</main>
<script id="gloss-data" type="application/json">__GLOSS_DATA__</script>
<!--GLOSS_DATA_SCRIPT-->
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const msgEl=$('msg');
function showMsg(t){msgEl.textContent=t;msgEl.classList.add('on');}
function hideMsg(){msgEl.classList.remove('on');}

/* ---- data ---- */
let data;
try{
  // Split output (default): views.js sets window.GLOSS_DATA. Inline output: the JSON is embedded.
  data=window.GLOSS_DATA||JSON.parse($('gloss-data').textContent);
  if(!data||typeof data!=='object')throw new Error('no data: is views.js next to viewer.html? Re-run gloss view.');
}catch(e){
  showMsg('Could not read the view data.\n'+e.message);
  return;
}
const details=(data.concepts&&typeof data.concepts==='object')?data.concepts:{};
const findings=Array.isArray(data.findings)?data.findings:[];
/* Only an http(s) template links: a javascript: or data: source-url from the repository would run on click. */
const srcURL=typeof data.sourceUrl==='string'&&/^https?:\/\//i.test(data.sourceUrl)?data.sourceUrl:'';
/* A path:line, linked to the code host when glossmark.yaml sets source-url. */
function srcLink(path,line){
  const txt=esc(path)+(line?':'+esc(line):'');
  if(!srcURL||!path)return `<span class="mono">${txt}</span>`;
  const url=srcURL.split('{path}').join(path.split('/').map(encodeURIComponent).join('/')).split('{line}').join(String(line||1));
  return `<a class="mono" href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`;
}
const views=Array.isArray(data.views)?data.views:[];
/* Precomputed feature slices (docs/adr/0023-feature-slices.md): for each concept and
   boundary, its members as [node, role, via step...] indexes into ids, roles and steps. */
const SL=(data.slices&&typeof data.slices==='object'&&data.slices.of)?data.slices:null;
const SROLES=SL&&Array.isArray(SL.roles)?SL.roles:[];
const SLICEDEFS={seed:'What the slice was asked for.',housed:'A concept the seed boundary realizes, holds, presents or hosts.',kind:'A kind of a member (is-a).',
  part:'A part of a member (part-of).',realization:'An implementation concept that realizes a member.',published:'Linked to a member by published-as.',
  flow:'Reached along a followed flow relation.',artifact:'Code, docs, pages or infrastructure linked to a member.',test:'A test whose only links to members are verifies.',
  boundary:'A boundary that realizes, holds or flows a member, or contains a member artifact.',context:'Explains the feature without belonging to it: drawn faded and never expanded further.'};
const diff=(data.diff&&typeof data.diff==='object')?data.diff:null;
$('repo').textContent=data.repo?('repo: '+data.repo):'';
$('generated').textContent=data.generated?('generated '+data.generated):'';
if(!views.length){showMsg('No views to show. Declare views in the GlossMark config and re-run gloss view.');return;}

/* Relations that place a concept inside a boundary: drawn as containment, not as arrows. */
const HOUSING=new Set(['realizes','represents']);
const CRIT=['low','medium','high','critical'];
const critRank=l=>CRIT.indexOf(l||'');
const PAD=22,TITLE=24;
/* Placement of a concept (see docs/FILE-FORMATS.md), in precedence order. Unplaced
   concepts are drawn in one labelled group per value, outside the boundary boxes. */
const PLACEMENTS=['housed','shared','flow','bound','surface','unlinked'];
const PLACEDEFS={
  housed:'Inside a boundary box: a boundary\u2019s code realizes or represents it.',
  shared:'Unplaced: several unrelated boundaries realize or represent it and no boundary encloses them all. A common parent manifest may be missing.',
  flow:'Unplaced: nothing shown produces or publishes it, or what does shares no enclosing boundary with what uses it. Expected for inputs from outside and for what passes between unrelated systems.',
  bound:'Unplaced: its value is bound to a line of code with value-from or publishes-value.',
  surface:'Unplaced: only pages present it or shells host it.',
  unlinked:'Unplaced: no boundary or artifact places it or flows it. Usually nothing links to it; gloss drift reports such a concept as an orphan.'};
const placeRank=v=>{const i=PLACEMENTS.indexOf(v);return i<0?PLACEMENTS.length:i;};
const GROUP='__placement:';

/* Per-view diff overlay: sets of added/removed/changed ids and edge keys. */
const ekey=e=>e.s+'|'+e.p+'|'+e.o;
function diffFor(name){
  const d={an:new Set(),rn:new Set(),cn:new Set(),ae:new Set(),re:new Map(),on:false};
  if(!diff||!Array.isArray(diff.views))return d;
  const dv=diff.views.find(x=>x&&x.view===name);
  if(!dv)return d;
  d.on=true;
  (dv.added_nodes||[]).forEach(x=>d.an.add(x));
  (dv.removed_nodes||[]).forEach(x=>d.rn.add(x));
  (dv.changed_nodes||[]).forEach(x=>d.cn.add(x));
  (dv.added_edges||[]).forEach(e=>e&&d.ae.add(ekey(e)));
  (dv.removed_edges||[]).forEach(e=>e&&d.re.set(ekey(e),e));
  return d;
}

/* ---- colours ---- */
let C={};
function readTheme(){
  const cs=getComputedStyle(document.documentElement);
  const g=n=>cs.getPropertyValue(n).trim();
  C={bg:g('--canvas'),grid:g('--grid'),bFill:g('--boundary-fill'),bStroke:g('--boundary-stroke'),bOpen:g('--boundary-open'),aFill:g('--artifact-fill'),
     edge:g('--edge'),contain:g('--edge-contain'),label:g('--label'),halo:g('--label-halo'),gold:g('--gold'),added:g('--added'),
     removed:g('--removed'),changed:g('--changed'),select:g('--select'),muted:g('--muted'),
     crit:{low:g('--crit-low'),medium:g('--crit-medium'),high:g('--crit-high'),critical:g('--crit-critical')},
     ns:g('--node-sat'),nl:g('--node-light'),ss:g('--stroke-sat'),sl:g('--stroke-light')};
}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hue(b){return (hash(b||'')*0.618033988)%1*360|0;}
function desat(s,f){return (parseFloat(s)*f)+'%';}
function nodeColours(n){
  if(n.type==='boundary')return {fill:C.bFill,stroke:C.bStroke};
  if(n.type==='artifact')return {fill:C.aFill,stroke:C.bStroke};
  const w=displacedFrom(n),h=hue(w?w.id:(n.branch||n.id)),impl=n.tier==='implementation';
  return {fill:`hsl(${h} ${impl?desat(C.ns,.45):C.ns} ${C.nl})`,stroke:`hsl(${h} ${impl?desat(C.ss,.55):C.ss} ${C.sl})`};
}
const critColour=l=>l&&C.crit[l]?C.crit[l]:null;

/* ---- state ---- */
const emptyFilters=()=>({type:new Set(),tier:new Set(),ns:new Set(),kind:new Set(),level:new Set(),crit:new Set(),place:new Set()});
const S={slice:null,vi:0,expanded:new Set(),pos:new Map(),pinned:new Set(),sel:null,hover:null,rels:new Set(),f:emptyFilters(),internal:false,q:'',focus:null,legendOpen:false,
  cam:{x:0,y:0,k:1},camMoved:false,theme:'auto'};
let V,byId,kidsOf,VN=[],VE=[],D,rng;
const cv=$('cv'),ctx=cv.getContext('2d'),tip=$('tip'),stage=$('stage'),panel=$('panel');
const coarse=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
let lastPtr='mouse'; // the last pointer type: touch gets wider hit targets
let RC=new Map(); // rect cache for open boundaries, reset per frame

/* Deterministic PRNG so the layout is the same on every load. */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---- view loading ---- */
function loadView(i){
  S.vi=i;V=views[i]||{};
  const nodes=Array.isArray(V.nodes)?V.nodes.filter(n=>n&&n.id):[];
  const edges=Array.isArray(V.edges)?V.edges.filter(e=>e&&e.s&&e.o):[];
  D=diffFor(V.name);
  byId=new Map();nodes.forEach(n=>byId.set(n.id,n));
  // Ghost nodes for removed ids so removed edges have endpoints.
  D.rn.forEach(id=>{if(!byId.has(id)){const g={id,label:id,type:'concept',kind:'',ghost:true};byId.set(id,g);nodes.push(g);}});
  D.re.forEach((e,k)=>{if(!edges.some(x=>ekey(x)===k))edges.push(Object.assign({ghost:true,source:'declared'},e));});
  // One always-open group per placement value that leaves concepts outside every box.
  [...new Set(nodes.filter(n=>n.type==='concept'&&n.placement&&n.placement!=='housed').map(n=>n.placement))].sort((a,b)=>placeRank(a)-placeRank(b)).forEach(v=>{
    const g={id:GROUP+v,label:'unplaced · '+v,type:'placement',placement:v,group:true,doc:PLACEDEFS[v]||''};byId.set(g.id,g);nodes.push(g);});
  // Drop self-references and dangling parents/boundaries.

function rebuild(seedAll){

  nodes.forEach(n=>{n._c=containerOf(n);});
  kidsOf=new Map();
  nodes.forEach(n=>{if(n._c){if(!kidsOf.has(n._c.id))kidsOf.set(n._c.id,[]);kidsOf.get(n._c.id).push(n);}});

function measure(){

    ['<i class="sw c k critical"></i>','critical','A mistake here moves money, breaks the law or stops the business.']],
   note:'Rings on concepts and artifacts, outline colour on boundaries. No ring means unclassified.'},
  {name:'Edges',items:[
    ['<i class="ln"></i>','declared','Solid line: declared in an ontology file or a boundary manifest.'],
    ['<i class="ln thin"></i>','inline','Thin line: from a @gloss marker in the code.'],
    ['<i class="ln d"></i>','derived','Dashed line: derived by the rollup rules (such as the realization lift); written by the tool, never by hand.'],
    ['<i class="ln dot"></i>','proposed','Dotted line: a proposal (@gloss? or a proposed: true entry) that a human has not yet accepted.'],
    ['<i class="ln thick"></i>','lifted','Thick line marked ↑: a boundary’s links to several concepts lifted to their least common subsumer (is-a); the panel lists the originals under via.']]},
  {name:'Diff',diff:true,items:[
    ['<i class="ln add"></i>','added','Green: added since the base the diff compares against.'],
    ['<i class="ln rem"></i>','removed','Red: removed since the base; a removed node is drawn hollow and dashed.'],
    ['<span style="color:var(--changed)">◌</span>','changed','Orange dashed ring: a node whose definition changed since the base.']]},
];
// Relation definitions, read as "A <relation> B" in the direction the edge is drawn.
// Worded from docs/ADVANCED.md and internal/model/vocab.go.
const RELDEFS={
  'realizes':'A stands for B. An implementation concept realizes the core concept it is the mechanism for; a boundary realizes what its code implements. Places B inside A\u2019s box. Often derived by rollup from implements.',
  'implements':'A is the code that does the work of B: the handler, pipeline or module behind a process, capability or event. Lifts to the boundary as realizes.',
  'represents':'A is the data shape of B: a model, table or schema. On an entity it lifts to the boundary as holds.',
  'replaced-by':'A is deprecated and B takes over: the replaced-by key on a concept or a boundary manifest. A is drawn dotted.',
  'holds':'Boundary A stores B\u2019s data. Derived from represents on an entity or declared in a manifest; gloss drift compares the two.',
  'presents':'A is a UI surface that shows B: a page or screen. Lifts as presents, never as realizes, and carries no criticality.',
  'hosts':'A is a shell or container for B: the app frame or a router. Lifts as hosts, never as realizes.',
  'verifies':'A is a test that checks B.',
  'tests':'Alias of verifies: A is a test that checks B.',
  'documents':'A is Markdown that explains B.',
  'instructs':'A is an agent file whose instructions concern B.',
  'may-modify':'Agent A may change B. A link outside this remit by that agent is HARD in gloss diff.',
  'publishes-value':'The line at A holds B\u2019s published value. Changing it without updating the ontology value is value-drift.',
  'provisions':'A is infrastructure code that creates B. On a resource or system-type it lifts to the boundary as realizes.',
  'configures':'A is configuration for B. On a resource or system-type it lifts to the boundary as realizes.',
  'deploys':'A is a CI or release job that ships B. On a resource or system-type it lifts to the boundary as realizes.',
  'produces':'A creates or outputs B. Declared on concepts and manifests (intended) or marked on code (actual); lifted to boundaries, where producing something undeclared is a violation.',
  'consumes':'A takes B as input. Intended (declared) or actual (code); lifted to boundaries and compared like produces.',
  'publishes':'A emits event B. Lifted to boundaries; a publisher in one repository and a subscriber in another get a context-map edge in gloss landscape.',
  'subscribes':'A listens for event B. Lifted to boundaries and matched against publishers across repositories.',
  'constrains':'A limits B: a constraint or measure that applies to B, such as a cut-off time that constrains settlement. Declared in the ontology.',
  'reverses':'A undoes B, such as a refund that reverses a capture. Declared in the ontology.',
  'attaches-to':'A exists only alongside B and is attached to it. Declared in the ontology.',
  'is-a':'A is a kind of B. A inherits what B realizes, and lifting rolls links up this taxonomy.',
  'part-of':'A is a part of B. A part realizes what its whole realizes.',
  'has-part':'B is a part of A (the inverse of part-of).',
  'published-as':'Implementation concept A surfaces in the business view as core concept B: the only seam between tiers and across repositories.',
  'depends-on':'A depends on B. Derived from imports and lifted to boundaries; written by the tool, never by hand.',
  'calls':'A calls B. Reserved for code-index data; not yet produced.',
  'owns':'A owns B. Imported from CODEOWNERS or Backstage; not yet produced.',
  'same-as':'A and B are the same concept in different vocabularies (SSSOM). Reserved.',
  'derived-from':'A is derived from B. Reserved.'};
const relDef=r=>RELDEFS[r]||'A domain relation declared under relations: in an ontology file.';
function reveal(n){ // expand every container, then select and centre
  let c=n._c||containerOf(n),g=0;while(c&&g++<64){S.expanded.add(c.id);c=c._c||containerOf(c);}
  if(n.internal&&!S.internal){S.internal=true;const el=$('internal');if(el)el.checked=true;}
  if(S.focus&&!(n.id===S.focus||under(n,byId.get(S.focus))))S.focus=null;
  rebuild(false);S.sel=n;const p=centre(n);if(p){S.cam.x=cv.clientWidth/2-p.x*S.cam.k;S.cam.y=viewH()/2-p.y*S.cam.k;S.camMoved=true;}
  renderPanel();draw();
}
panel.addEventListener('toggle',ev=>{if(ev.target.classList.contains('defs'))S.legendOpen=ev.target.open;},true);
panel.addEventListener('click',ev=>{
  const b=ev.target.closest('button[data-act]');
  if(b&&S.sel&&S.sel.id){
    const n=S.sel;
    switch(b.dataset.act){
      case 'open':S.expanded.add(n.id);rebuild(false);break;
      case 'close':collapse(n);rebuild(false);break;
      case 'focus':setFocus(n.id);return;
      case 'unfocus':setFocus(null);return;
      case 'up':if(n._c){S.sel=n._c;}break;
      case 'slice':setSlice(sliceSeedsFor(n));return;
    }
    renderPanel();draw();return;
  }
  const a=ev.target.closest('a.n');if(!a)return;
  if(a.dataset.clearslice){setSlice(null);return;}
  const n=byId.get(a.dataset.id);if(!n)return;
  reveal(n);
});

/* ---- interaction ---- */
let drag=null,moved=false;
// Touch: the pointers down on the canvas; two of them pinch to zoom and pan.
const pts=new Map();let pinch=null;
function pinchGeom(){const [a,b]=[...pts.values()];return {d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function moveSubtree(n,dx,dy){const p=S.pos.get(n.id);if(p){p.x+=dx;p.y+=dy;}descendants(n,[]).forEach(k=>{const q=S.pos.get(k.id);if(q){q.x+=dx;q.y+=dy;}});}
cv.addEventListener('pointerdown',ev=>{
  lastPtr=ev.pointerType||'mouse';
  pts.set(ev.pointerId,{x:ev.offsetX,y:ev.offsetY});
  if(pts.size>=2){ // a second finger: stop dragging, start pinching
    cv.setPointerCapture(ev.pointerId);
    if(pts.size===2){drag=null;moved=true;tip.style.display='none';const g=pinchGeom();pinch={...g,cam:{...S.cam}};}
    return;
  }
  const w=toWorld(ev.offsetX,ev.offsetY),n=hitNode(w);
  drag={sx:ev.offsetX,sy:ev.offsetY,cam:{...S.cam},node:n,lx:w.x,ly:w.y};
  moved=false;cv.classList.add('drag');cv.setPointerCapture(ev.pointerId);
});
cv.addEventListener('pointermove',ev=>{
  if(pts.has(ev.pointerId))pts.set(ev.pointerId,{x:ev.offsetX,y:ev.offsetY});
  if(pinch){
    if(pts.size<2)return;
    const g=pinchGeom(),k=Math.min(8,Math.max(.05,pinch.cam.k*g.d/pinch.d));
    // The world point under the fingers' first midpoint follows the midpoint.
    const wx=(pinch.x-pinch.cam.x)/pinch.cam.k,wy=(pinch.y-pinch.cam.y)/pinch.cam.k;
    S.cam={k,x:g.x-wx*k,y:g.y-wy*k};S.camMoved=true;draw();return;
  }
  if(drag){
    const dx=ev.offsetX-drag.sx,dy=ev.offsetY-drag.sy;
    if(Math.hypot(dx,dy)>3)moved=true;
    if(!moved)return;
    if(drag.node){const w=toWorld(ev.offsetX,ev.offsetY);moveSubtree(drag.node,w.x-drag.lx,w.y-drag.ly);drag.lx=w.x;drag.ly=w.y;S.pinned.add(drag.node.id);}
    else{S.cam.x=drag.cam.x+dx;S.cam.y=drag.cam.y+dy;S.camMoved=true;}
    tip.style.display='none';draw();return;
  }
  if(ev.pointerType!=='mouse'&&ev.pointerType)return; // no hover on touch
  const w=toWorld(ev.offsetX,ev.offsetY),h=hitNode(w)||hitEdge(w);
  if(h!==S.hover){S.hover=h;draw();}
  cv.classList.toggle('hit',!!h);
  if(h){tip.innerHTML=h.id?nodeTip(h):edgeTip(h);tip.style.display='block';
    const r=stage.getBoundingClientRect(),tx=Math.min(ev.offsetX+14,r.width-tip.offsetWidth-6),ty=Math.min(ev.offsetY+14,r.height-tip.offsetHeight-6);
    tip.style.left=Math.max(0,tx)+'px';tip.style.top=Math.max(0,ty)+'px';}
  else tip.style.display='none';
});
// A single click selects and (after a short wait, so a double-click can cancel
// it) opens or closes the node; a double-click focuses a boundary.
let pendingToggle=null,lastClick={id:null,t:0};
function toggle(n){if(n.group)return;S.expanded.has(n.id)?collapse(n):S.expanded.add(n.id);rebuild(false);renderPanel();draw();}
function endDrag(ev){
  if(!drag)return;cv.classList.remove('drag');
  drag=null;
  if(moved)return;
  const w=toWorld(ev.offsetX,ev.offsetY),n=hitNode(w);
  if(n&&ev.altKey&&!n.group&&!n.ghost){setSlice(sliceSeedsFor(n));if(n._vis)S.sel=n;renderPanel();draw();return;}
  if(n){
    S.sel=n;
    const now=performance.now(),dbl=lastClick.id===n.id&&now-lastClick.t<350;
    lastClick={id:n.id,t:now};
    if(pendingToggle){clearTimeout(pendingToggle);pendingToggle=null;}
    if(dbl){lastClick={id:null,t:0};if(n.type==='boundary'){setFocus(n.id);return;}if(n._kids)toggle(n);}
    else if(n._kids&&!n.group)pendingToggle=setTimeout(()=>{pendingToggle=null;toggle(n);},240);
  }
  else{const e=hitEdge(w);S.sel=e||null;}
  renderPanel();draw();
}
function collapse(n){if(n.group)return;S.expanded.delete(n.id);descendants(n,[]).forEach(k=>{if(!k.group)S.expanded.delete(k.id);});if(S.focus&&(S.focus===n.id||under(byId.get(S.focus),n)))S.focus=null;}
// After a pinch, the fingers lift one by one; none of them is a tap.
cv.addEventListener('pointerup',ev=>{pts.delete(ev.pointerId);if(pinch||moved&&!drag){if(pts.size<2)pinch=null;return;}endDrag(ev);});
cv.addEventListener('pointercancel',ev=>{pts.delete(ev.pointerId);if(pts.size<2)pinch=null;drag=null;cv.classList.remove('drag');});
cv.addEventListener('pointerleave',()=>{if(!drag){S.hover=null;tip.style.display='none';draw();}});
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const f=Math.exp(-ev.deltaY*0.0015),k=Math.min(8,Math.max(.05,S.cam.k*f)),r=k/S.cam.k;
  S.cam.x=ev.offsetX-(ev.offsetX-S.cam.x)*r;S.cam.y=ev.offsetY-(ev.offsetY-S.cam.y)*r;S.cam.k=k;S.camMoved=true;draw();
},{passive:false});
window.addEventListener('keydown',ev=>{if(ev.target.tagName==='INPUT'||ev.target.tagName==='SELECT')return;
  if(ev.key==='Escape'){if(S.sel){S.sel=null;renderPanel();draw();}else if(S.focus){const F=byId.get(S.focus);setFocus(F&&F._c&&F._c.type==='boundary'?F._c.id:null);}else if(S.slice)setSlice(null);}
  if(ev.key==='f')fit();});
// A resize (a phone turned sideways) refits the map unless the reader has panned or zoomed.
new ResizeObserver(()=>{if(!S.camMoved&&VN.length)fit();else draw();}).observe(stage);

/* ---- controls ---- */
const sel=$('viewSel');
views.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(v&&v.name)||('view '+(i+1));sel.appendChild(o);});
sel.onchange=()=>loadView(+sel.value);
$('search').oninput=ev=>{S.q=ev.target.value.trim().toLowerCase();draw();};
$('filtersBtn').onclick=()=>{$('filters').classList.toggle('on');$('filtersBtn').classList.toggle('on');};
$('expandAll').onclick=()=>{V._nodes.forEach(n=>{if(kidsOf.has(n.id))S.expanded.add(n.id);});rebuild(false);fit();renderPanel();};
$('collapseAll').onclick=()=>{S.expanded=groupIds();S.focus=null;rebuild(false);fit();renderPanel();};
$('fit').onclick=fit;
$('relayout').onclick=()=>{S.pinned.clear();rebuild(true);fit();};
const themes=['auto','light','dark'];
function applyTheme(t){S.theme=t;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  $('themeBtn').textContent='Theme: '+t;readTheme();draw();try{localStorage.setItem('gloss-theme',t);}catch(e){}}
$('themeBtn').onclick=()=>applyTheme(themes[(themes.indexOf(S.theme)+1)%3]);
let saved='auto';try{saved=localStorage.getItem('gloss-theme')||'auto';}catch(e){}
if(!themes.includes(saved))saved='auto';
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTheme();draw();});

/* Small hook for automation/tests: screen position of a node, layout state, drill-down. */
window.glossViewer={
  screenPos(id){const n=byId.get(id);if(!n||!n._vis)return null;const p=centre(n);return p?{x:p.x*S.cam.k+S.cam.x,y:p.y*S.cam.k+S.cam.y}:null;},
  busy(){return false;},
  visible(){return VN.map(n=>n.id);},
  open(id){const n=byId.get(id);if(!n)return false;S.expanded.add(id);rebuild(false);renderPanel();draw();return true;},
  close(id){const n=byId.get(id);if(!n)return false;collapse(n);rebuild(false);renderPanel();draw();return true;},
  focus(id){setFocus(id);},
  containerOf(id){const n=byId.get(id);return n&&n._c?n._c.id:null;},
  rect(id){const n=byId.get(id);if(!n||!n._vis||!n._open)return null;RC=new Map();return rectOf(n);},
  box(id){const n=byId.get(id);if(!n||!n._vis)return null;if(n._open){RC=new Map();const r=rectOf(n);return {x0:r.x,y0:r.y,x1:r.x+r.w,y1:r.y+r.h,open:true};}
    const p=S.pos.get(n.id);return p?{x0:p.x-n._hw,x1:p.x+n._hw,y0:p.y-n._h/2-4,y1:p.y+n._h/2+18,open:false}:null;},
  edges(){return VE.filter(e=>!e.contain).map(e=>({s:e.s.id,p:e.p,o:e.o.id}));},
  select(id){const n=byId.get(id);if(!n)return false;reveal(n);return true;},
  panel(){return $('panelBody').innerText;},
  filter(group,value){if(!S.f[group])return false;S.f[group].has(value)?S.f[group].delete(value):S.f[group].add(value);buildFilters();rebuild(false);renderPanel();draw();return true;},
  slice(seeds){setSlice(seeds&&seeds.length?seeds:null);return S.slice?[...S.slice.roles.keys()].sort():null;},
  sliceOf(seed){const m=sliceOf(seed);return m?m.map(x=>x.id).sort():null;},
  state(){return {view:V.name,slice:S.slice?S.slice.seeds:null,focus:S.focus,expanded:[...S.expanded],nodes:VN.length,edges:VE.filter(e=>!e.contain).length};}
};

/* ---- go ---- */
applyTheme(saved);
try{loadView(0);const hs=readHash();if(hs&&SL)setSlice(hs,true);}catch(e){showMsg('The viewer hit an error while rendering.\n'+e.message);console.error(e);}
window.addEventListener('hashchange',()=>{if(SL)setSlice(readHash(),true);});
})();
</script>

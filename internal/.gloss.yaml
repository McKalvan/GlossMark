# internal/.gloss.yaml: the library every command is built from. It contains
# seven logical components (reading, graph, checking, review, projection,
# onboarding, agents), each a code-less directory whose manifest the packages
# name with part-of (ADR 0035), so this container declares nothing of its own:
# inherit is the union of what the components declare, and they inherit from
# their packages in turn.
boundary: arch:glossmark-lib
level: container
label: GlossMark library
part-of: arch:glossmark
realizes: [inherit]
produces: [inherit]
publishes: [inherit]
holds: [inherit]
default-namespace: gmi
# allowed: the derived set (gmi:*, everything the components declare, their
# parts and cores) plus gm:GlossMark, which the e2e tests under this directory
# verify without any package declaring it.
allowed: [derived, gm:GlossMark]
owner: glossmark

# internal/.gloss.yaml: the library every command is built from.
boundary: arch:glossmark-lib
level: container
label: GlossMark library
part-of: arch:glossmark
realizes: [gm:Extraction, gm:Lint, gm:Rollup, gm:DriftComparison, gm:Gating, gm:Review, gm:Projection, gm:Publication, gm:Landscape, gm:Vocabulary, gm:Onboarding, gm:TierSeparation, gm:PublishedSeam, gm:OwnSubjectRule, gm:DeclaredCapability, gm:AllowedList, gm:ValueBinding, gm:Criticality]
produces: [gm:Graph, gm:View, gm:Drift, gm:Impact, gm:Coverage, gm:DecisionRequest, gm:ProposedLink]
publishes: [gm:LinkProposed, gm:LinkAccepted, gm:LinkRejected, gm:LinkStale, gm:DecisionRequested, gm:DriftDetected]
# holds: the core concepts whose data shapes live here (represents derives it,
# whatever the kind, and gloss drift compares the two).
holds: [gm:Artifact, gm:Concept, gm:Relation, gm:Namespace, gm:Boundary, gm:Link, gm:ProposedLink, gm:View, gm:Graph, gm:Ledger, gm:Confidence]
default-namespace: gmi
# allowed: the derived set (gmi:*, everything declared above, their parts and
# cores) plus the concept the library links to without declaring it: the
# self-host test verifies gm:GlossMark.
allowed: [derived, gm:GlossMark]
owner: glossmark

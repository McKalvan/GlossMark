name: ci
on: [pull_request, push]
jobs:
  booking-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/booking-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go vet ./... && go test ./...
  reminders:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/reminders } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[test]' && pytest
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npm run lint && npm run build

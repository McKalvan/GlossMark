# @gloss deploys .BookingApiService, .ReminderService, .PatientSite scope=file conf=0.85
name: deploy
on:
  push:
    branches: [main]
permissions: { id-token: write, contents: read, packages: write }
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [booking-api, reminders, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'web' && 'apps/web' || format('services/{0}', matrix.service) }}
          push: true
          tags: ghcr.io/larkspur-clinics/${{ matrix.service }}:${{ github.sha }}
  rollout:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "arn:aws:iam::123456789012:role/clinic-booking-deploy", aws-region: eu-west-2 }
      - run: aws eks update-kubeconfig --name clinic-booking-prod
      - run: |
          kubectl apply -f deploy/k8s/ --recursive
          for svc in booking-api reminders-worker web; do
            kubectl -n clinic-booking set image deployment/$svc "*=ghcr.io/larkspur-clinics/${svc%-worker}:${{ github.sha }}"
          done

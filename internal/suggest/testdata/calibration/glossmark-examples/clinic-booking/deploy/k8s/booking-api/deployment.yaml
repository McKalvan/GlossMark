# @gloss deploys .BookingApiService conf=0.9
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  namespace: clinic-booking
  labels: { app: booking-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: booking-api }
  template:
    metadata:
      labels: { app: booking-api }
    spec:
      serviceAccountName: booking-api
      containers:
        - name: booking-api
          image: ghcr.io/larkspur-clinics/booking-api:1.14.2
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: booking-api } }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: booking-db, key: url } }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-api
  namespace: clinic-booking
spec:
  selector: { app: booking-api }
  ports: [{ port: 8080, targetPort: 8080 }]

[project]
name = "larkspur-reminders"
version = "1.8.0"
description = "Appointment reminders and the no-show report for Larkspur Clinics"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "psycopg[binary]>=3.2",
  "jinja2>=3.1",
  "pydantic-settings>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "freezegun>=1.5"]

[project.scripts]
reminders-worker = "reminders.main:run_worker"
noshow-report = "reminders.main:run_noshow_report"

[tool.pytest.ini_options]
testpaths = ["tests"]

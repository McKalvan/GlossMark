[package]
name = "kestrel-tracking"
version = "0.9.3"
edition = "2021"
description = "Kestrel Freight tracking service: GPS pings, scan events, geofence arrival and proof of delivery"
publish = false

[lib]
name = "kestrel_tracking"
path = "src/lib.rs"

[[bin]]
name = "tracking"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid", "macros", "migrate"] }
rdkafka = { version = "0.36", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

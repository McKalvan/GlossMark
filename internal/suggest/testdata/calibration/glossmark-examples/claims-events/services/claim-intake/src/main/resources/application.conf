# @gloss configures tide:IntakeService scope=file conf=0.8
ktor {
  deployment { port = 8080, port = ${?PORT} }
  application { modules = [ com.tidewater.claims.intake.ApplicationKt.module ] }
}

kafka {
  bootstrap = ${KAFKA_BOOTSTRAP}
  schemaRegistry = ${SCHEMA_REGISTRY_URL}
  filedTopic = "claims.filed.v1"
  lifecycleTopic = "claims.lifecycle.v1"
  transactionalIdPrefix = "claim-intake-"
}

policyAdmin {
  baseUrl = ${POLICY_ADMIN_URL}
  timeoutMillis = 1500
}

database {
  url = ${DATABASE_URL}
}

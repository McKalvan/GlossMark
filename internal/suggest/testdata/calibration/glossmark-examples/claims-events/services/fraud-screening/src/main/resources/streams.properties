# @gloss configures tide:FraudScreeningService scope=file conf=0.8
# Kafka Streams configuration. application.id is the consumer group id and the
# prefix of the internal changelog and repartition topics.
application.id=fraud-screening.v2
processing.guarantee=exactly_once_v2
num.stream.threads=2
replication.factor=3
default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde
commit.interval.ms=1000
consumer.auto.offset.reset=earliest
consumer.session.timeout.ms=45000

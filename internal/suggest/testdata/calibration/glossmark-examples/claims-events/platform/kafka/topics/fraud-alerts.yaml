# Claims fraud screening wants held. 180 days.
# @gloss provisions .FraudAlertsTopic conf=0.9
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fraud.alerts.v1
  namespace: claims
  labels:
    strimzi.io/cluster: claims-kafka
spec:
  topicName: fraud.alerts.v1
  partitions: 3
  replicas: 3
  config:
    retention.ms: "15552000000"
    min.insync.replicas: "2"
    cleanup.policy: delete
    message.timestamp.type: CreateTime
    confluent.value.schema.validation: "true"

# Newly filed claims (motor, flood, fire), keyed by claimId. 30 days.
# @gloss provisions .FiledTopic conf=0.9
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: claims.filed.v1
  namespace: claims
  labels:
    strimzi.io/cluster: claims-kafka
spec:
  topicName: claims.filed.v1
  partitions: 12
  replicas: 3
  config:
    retention.ms: "2592000000"
    min.insync.replicas: "2"
    cleanup.policy: delete
    message.timestamp.type: CreateTime
    confluent.value.schema.validation: "true"

# ontology/gmi.gloss.yaml (implementation tier): the Go packages and commands that realize gm:.
namespace: gmi
version: 0.1.0
concepts:
  GlossCli:           { kind: system-type, realizes: gm:GlossMark }
  # Reading a workspace
  MarkerGrammar:      { kind: process, realizes: gm:Extraction, doc: "Parsing one marker line and the per-extension comment table." }
  DeclarationAnchor:  { kind: process, realizes: gm:Extraction, doc: "Binding a marker to the declaration that follows it." }
  WorkspaceLoader:    { kind: process, realizes: gm:Extraction, doc: "Reading glossmark.yaml, ontology files, manifests and imports." }
  Extractor:          { kind: process, realizes: gm:Extraction, doc: "Pass 1; markers, manifests and ontologies into the graph." }
  FileFormats:        { kind: resource, internal: true, doc: "The typed shapes of every file GlossMark reads or writes." }
  # The graph and what is derived from it
  CanonicalGraph:     { kind: resource, realizes: gm:Graph }
  Linter:             { kind: process, realizes: [gm:Lint, gm:TierSeparation, gm:PublishedSeam, gm:OwnSubjectRule, gm:AllowedList], doc: "Where the tier, seam, own-subject and allowed-list constraints are enforced." }
  RollupEngine:       { kind: process, realizes: gm:Rollup }
  DriftComparator:    { kind: process, realizes: [gm:DriftComparison, gm:DeclaredCapability], produces: [gm:Coverage, gm:DecisionRequest], publishes: [gm:DecisionRequested] }
  Gate:               { kind: process, realizes: gm:Gating }
  ReviewLedger:       { kind: resource, realizes: gm:Ledger, publishes: [gm:LinkStale] }
  ReviewCommands:     { kind: process, realizes: gm:Review, doc: "accept, reject and status." }
  # Outputs
  ViewProjector:      { kind: process, realizes: gm:Projection }
  HtmlViewer:         { kind: process, part-of: ViewProjector, presents: gm:View, doc: "The static page that shows a projection: a UI surface for views, not their mechanism." }
  Publisher:          { kind: process, realizes: gm:Publication, doc: "Per-namespace ontology.jsonld and graph.jsonl for importers." }
  SqliteExport:       { kind: process, internal: true }
  LandscapeAssembler: { kind: process, realizes: gm:Landscape, doc: "Unions sibling repositories' graphs by IRI; realizes the landscape itself, there is no separate federation process yet." }
  ValueBinder:        { kind: process, realizes: gm:ValueBinding, doc: "Resolves value-from and publishes-value to a line of code; the ledger baselines it and the comparator reports drift." }
  DefaultSoftThreshold:
    kind: measure
    realizes: gm:Confidence
    value: 0.7
    doc: "The default soft-conf-threshold: proposals at or above it are SOFT. Bound to DefaultPolicy by a publishes-value marker."
  GraphFormatVersion:
    kind: measure
    internal: true
    value: 1
    value-from: { path: internal/version/version.go, symbol: GraphFormat }
    doc: "The graph.jsonl record format docs/VERSIONING.md documents; bumping it in code without here is value drift."
  TextDiff:           { kind: process, internal: true, doc: "Unified diffs of ontology files, so a suggested edit is reviewable before it is written." }
  # Onboarding
  Scaffolder:         { kind: process, realizes: gm:Onboarding, doc: "gloss init: config, tier files, manifests, views, CI job and hook in one command." }
  MarkerSuggester:    { kind: process, realizes: gm:Onboarding, doc: "gloss suggest: proposed links for unmarked public surfaces, from names, docstrings, the tables they touch and the code their tests call." }
  SuggestCalibration: { kind: process, realizes: gm:Onboarding, doc: "gloss suggest --eval, --calibrate and the calibration harness: precision and auto-accept rate per confidence band on labelled links, the counts conf is read from, and the auto-accept threshold derived from a precision target." }
  VocabularyImporter: { kind: process, realizes: gm:Onboarding, doc: "gloss import: a markdown glossary or an enums file into an owned namespace, re-runnable." }
  AdoptionSkill:      { kind: process, realizes: gm:Onboarding, doc: "The adopt-glossmark Claude Code skill, shipped in the binary." }
  EvidenceHarvester:  { kind: process, realizes: gm:Onboarding, doc: "gloss harvest: evidence of a repository's vocabulary from code, schemas, tests, UI, docs and git, before it has an ontology, and the lexical clusters a derivation starts from (ADR 0025)." }
  # Agents
  McpServer:          { kind: process, realizes: gm:Vocabulary, publishes: [gm:LinkProposed] }
  AgentsSnippet:      { kind: process, realizes: gm:Vocabulary, doc: "The AGENTS.md vocabulary snippet and the session-start briefing." }
  CriticalityStamper:
    kind: process
    realizes: gm:Criticality
    doc: "Stamps every concept, boundary and artifact with its effective criticality and reports boundaries that understate it."
  OntologyEditor:
    kind: process
    realizes: gm:Review
    doc: "Formatting-preserving edits to ontology files: add, accept or remove a proposed concept and rewrite NEW markers once it exists."
  ImportLock:
    kind: process
    realizes: gm:Publication
    doc: "Resolving import version ranges and pinning each import's version and content hash in glossmark.lock: the importer's side of the published seam."
  Doctor:
    kind: process
    internal: true
    doc: "One-line setup checks, each with its fix."
  FormatVersions:
    kind: resource
    internal: true
    doc: "The tool release, grammar and on-disk format versions."

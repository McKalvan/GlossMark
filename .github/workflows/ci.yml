# @gloss configures gmi:GlossCli scope=file
name: ci
on:
  push:
    branches: [main]
  pull_request:
    # labeled and unlabeled re-run the gate: the ontology-approved label is how
    # a reviewer records the human decision a HARD change needs.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # release.yml runs every gate below before it builds a binary.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The go.mod minimum, and the toolchain releases are built with.
        go: ["1.24", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ matrix.go }}", cache: true }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - name: Examples still build and drift as documented
        run: |
          go build -o gloss ./cmd/gloss
          (cd examples/library/circulation && ../../../gloss check && ../../../gloss build -q)
          (cd examples/library/holds-worker && ../../../gloss check && ../../../gloss build -q)
          ./gloss landscape examples/library/circulation examples/library/holds-worker --fail-on dangling

  # GlossMark on GlossMark, through the Action built from this checkout: the
  # committed graph matches the tree, gloss check is clean, drift fails on
  # every finding kind but overlap (the command line and the library it calls
  # realize the same concepts by design, ADR 0019), stale links included, and
  # concept coverage stays at 100%. On a pull request it posts the impact
  # comment. It does not gate: the PR's own action.yml and gloss would judge
  # the PR (#187), so the gate job below does that with the base's.
  glossmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          version: source
          check-graph: "true"
          drift-fail-on: violation,value-drift,gap,dangling,overdue,planned-closed,plan-overdue,out-of-range,deprecated-use,rogue,orphan,untested,presented-only,stale,proposed
          coverage-fail-under: "100"
          fail-on: none
          # A fork's token cannot comment; its PRs still get the gate.
          comment: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  # The gate: gloss built from the base commit classifies the PR, so a PR that
  # edits the Gate step, action.yml, cmd/gloss or internal/gate is judged by
  # the code it changes, not by its changed copy (#187). A HARD change fails
  # until a reviewer labels it ontology-approved.
  gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - name: Build gloss from the base commit
        env: { BASE_SHA: "${{ github.event.pull_request.base.sha }}" }
        run: |
          git worktree add --detach "$RUNNER_TEMP/base-tool" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base-tool" && go build -trimpath -o "$RUNNER_TEMP/gate-bin/gloss" ./cmd/gloss)
          git worktree remove --force "$RUNNER_TEMP/base-tool"
      - name: gloss diff (base binary)
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          AUTHOR: "${{ github.event.pull_request.user.login }}"
          AUTHOR_TYPE: "${{ github.event.pull_request.user.type }}"
          # The label approves the commits a reviewer saw: a push (synchronize)
          # is gated again, and approval-reset takes the label off.
          FAIL_ON: ${{ contains(github.event.pull_request.labels.*.name, 'ontology-approved') && github.event.action != 'synchronize' && 'none' || 'HARD' }}
        run: |
          GLOSS="$RUNNER_TEMP/gate-bin/gloss"
          if [ "$AUTHOR_TYPE" = "Bot" ]; then ACTOR="agent:${AUTHOR%\[bot\]}"; else ACTOR="human:$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')"; fi
          # A base from before --actor existed gates without it.
          set -- --base "$BASE_SHA" --fail-on "$FAIL_ON"
          if "$GLOSS" diff -h 2>&1 | grep -q -- '-actor'; then set -- "$@" --actor "$ACTOR"; fi
          "$GLOSS" diff "$@"

  # A push after ontology-approved invalidates it: the label is removed, so a
  # reviewer re-applies it to the new commits (the labeled event re-runs the gate).
  approval-reset:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ontology-approved') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({ ...context.repo, issue_number: context.payload.pull_request.number, name: 'ontology-approved' });

# @gloss deploys gmi:GlossCli scope=file
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Every CI gate, the self-hosted GlossMark checks included, passes on the
  # tagged commit before a binary is built.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write
  build:
    needs: ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - name: Build
        env: { GOOS: "${{ matrix.goos }}", GOARCH: "${{ matrix.goarch }}", CGO_ENABLED: "0" }
        run: |
          VERSION="${GITHUB_REF_NAME}"
          EXT=""; [ "$GOOS" = windows ] && EXT=".exe"
          OUT="gloss_${VERSION}_${GOOS}_${GOARCH}${EXT}"
          go build -trimpath -ldflags "-s -w -X github.com/mckalvan/glossmark/internal/version.Version=${VERSION}" -o "dist/${OUT}" ./cmd/gloss
          (cd dist && sha256sum "${OUT}" > "${OUT}.sha256")
      - uses: actions/upload-artifact@v4
        with: { name: "gloss-${{ matrix.goos }}-${{ matrix.goarch }}", path: dist/* }
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

# ontology/zoo.gloss.yaml  (core tier: the platonic ideal; never mentions impl:)
namespace: zoo
version: 1.0.0
doc: What the zoo business recognises about horses and their production.
concepts:
  Animal:             { kind: entity }
  Horse:              { kind: entity, is-a: Animal }
  Mare:               { kind: entity, is-a: Horse, doc: A female horse of breeding age. }
  Stallion:           { kind: entity, is-a: Horse }
  Foal:               { kind: entity, is-a: Horse }
  Donkey:             { kind: entity, is-a: Animal }
  HorseOrder:         { kind: entity, doc: A customer order for horses. }
  HorseFactory:       { kind: system-type, produces: [Horse] }
  Breeding:           { kind: process, consumes: [Mare, Stallion], produces: [Foal] }
  Foaling:            { kind: process, produces: [Foal], publishes: [FoalBorn] }
  FoalBorn:           { kind: event }
  ProductionCapacity: { kind: constraint, constrains: [HorseOrder], doc: How many horses the factory can deliver per period; the value comes from engineering. }
relations:
  produces: { lift: range-lcs }
  consumes: { lift: range-lcs }

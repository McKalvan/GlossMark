# ontology/views.yaml: declared projections over tier × zoom.
views:
  business:
    doc: What the zoo business sees. Implementation folds into what it realizes.
    include: [zoo:*]
    collapse: { "impl:*": via realizes }      # impl nodes fold into what they realize
    show-published: true
    relations: [produces, consumes, constrains, publishes, is-a, realizes]
    lift: range-lcs                            # {Mare, Stallion} shows as Horse
    zoom: system
  engineering:
    doc: Both tiers, two levels of hooves and tails, container zoom.
    include: [zoo:*, impl:*]
    expand: { part-of: 2 }
    zoom: container
  capacity:
    doc: A curated view (it names its concepts, so it opens expanded) of the capacity constraint, what it constrains and the code behind it.
    include: [zoo:ProductionCapacity, zoo:HorseOrder, impl:FoalingPipelineThroughput]
    zoom: code

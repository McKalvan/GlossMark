# payments-api/ontology/pa.gloss.yaml  (implementation: pa: realizes core; one concept is internal)
namespace: pa
version: 0.9.0
concepts:
  AuthorizeHandler: { kind: process, realizes: pay:Authorization }
  CaptureHandler:   { kind: process, realizes: pay:Capture }
  CaptureQueue:     { kind: resource, internal: true }
  CaptureEmitter:   { kind: process, part-of: CaptureHandler, realizes: pay:CaptureConfirmed, publishes: [pay:CaptureConfirmed] }   # emits the confirmation as part of capturing

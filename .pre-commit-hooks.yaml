# @gloss configures gmi:GlossCli scope=file
# pre-commit framework hooks (https://pre-commit.com). Add to your .pre-commit-config.yaml:
#   - repo: https://github.com/mckalvan/glossmark
#     rev: v0.3.0            # pin a released tag
#     hooks: [{id: gloss-check}, {id: gloss-build}]
- id: gloss-check
  name: gloss check
  description: Lint @gloss markers, manifests and ontology files.
  entry: gloss check
  language: golang
  pass_filenames: false
  additional_dependencies: ["github.com/mckalvan/glossmark/cmd/gloss@v0.3.0"]
- id: gloss-build
  name: gloss build
  description: Regenerate .glossmark/graph.jsonl so the committed graph matches the tree.
  entry: gloss build -q
  language: golang
  pass_filenames: false
  additional_dependencies: ["github.com/mckalvan/glossmark/cmd/gloss@v0.3.0"]
- id: gloss-drift
  name: gloss drift
  description: Fail on violations and gaps between declared boundaries and the code.
  entry: gloss drift
  language: golang
  pass_filenames: false
  additional_dependencies: ["github.com/mckalvan/glossmark/cmd/gloss@v0.3.0"]
- id: gloss-stale
  name: gloss stale links
  description: Fail while any accepted link is stale; re-confirm with gloss accept --stale <paths>.
  entry: gloss drift --fail-on stale
  language: golang
  pass_filenames: false
  additional_dependencies: ["github.com/mckalvan/glossmark/cmd/gloss@v0.3.0"]
